<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OPTIMAL — Establece tu contraseña</title>
  <link rel="icon" type="image/png" href="logo/OPTIMAL_Avatar_Negativo_L (1).png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #161616;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }



    .subtitle {
      font-size: 11px;
      letter-spacing: 4px;
      color: #888;
      margin-bottom: 48px;
    }

    .card {
      background: #1e1e1e;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
    }

    .card h1 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .card p {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    label {
      display: block;
      font-size: 13px;
      color: #aaa;
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      background: #161616;
      border: 1px solid #333;
      border-radius: 8px;
      color: #fff;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 4px;
    }

    input[type="password"]:focus {
      border-color: #E5FA76;
    }

    .field {
      margin-bottom: 20px;
    }

    .error-msg {
      font-size: 12px;
      color: #ef4444;
      min-height: 18px;
    }

    .btn {
      width: 100%;
      padding: 14px;
      background: #E5FA76;
      color: #161616;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
      margin-top: 8px;
    }

    .btn:hover { opacity: 0.9; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .global-error {
      background: #2d1515;
      border: 1px solid #ef4444;
      color: #ef4444;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
    }

    /* Success screen */
    .success {
      text-align: center;
      display: none;
    }

    .success .check {
      width: 72px;
      height: 72px;
      background: #16a34a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .success .check svg {
      width: 36px;
      height: 36px;
    }

    .success h2 {
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .success p {
      font-size: 14px;
      color: #888;
      margin-bottom: 28px;
    }

    .store-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .store-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: #161616;
      border: 1px solid #555;
      border-radius: 8px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      text-decoration: none;
      transition: border-color 0.2s;
    }

    .store-btn:hover { border-color: #fff; }

    .store-btn svg { width: 20px; height: 20px; }
  </style>
</head>
<body>

  <img src="logo/optimal-logo.png" alt="OPTIMAL" style="height: 48px; margin-bottom: 24px;">
  <div class="subtitle">Establece tu acceso a la app</div>

  <!-- Form -->
  <div class="card" id="formCard">
    <h1>Establece tu contraseña</h1>
    <p>Crea una contraseña segura para acceder a la app</p>

    <div class="global-error" id="globalError"></div>

    <form id="passwordForm" novalidate>
      <div class="field">
        <label for="password">Nueva contraseña</label>
        <input type="password" id="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
        <div class="error-msg" id="passwordError"></div>
      </div>

      <div class="field">
        <label for="confirm">Confirmar contraseña</label>
        <input type="password" id="confirm" placeholder="Repite la contraseña" autocomplete="new-password">
        <div class="error-msg" id="confirmError"></div>
      </div>

      <button type="submit" class="btn" id="submitBtn">Guardar contraseña</button>
    </form>
  </div>

  <!-- Success -->
  <div class="card success" id="successCard">
    <div class="check">
      <svg fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="3">
        <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
      </svg>
    </div>
    <h2>¡Ya tienes acceso a OPTIMAL!</h2>
    <p>Descarga la app e inicia sesión con tu email y la contraseña que acabas de crear.</p>
    <div class="store-buttons">
      <a href="#" class="store-btn">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        Descargar en App Store
      </a>
      <a href="#" class="store-btn">
        <svg viewBox="0 0 24 24" fill="#fff"><path d="M3.18 23.67c.55.31 1.22.28 1.75-.07l15.53-8.95-3.66-3.66L3.18 23.67zM.47 1.22C.17 1.56 0 2.03 0 2.6v18.8c0 .57.17 1.04.47 1.38L12.59 12 .47 1.22zM23.21 10.47l-4.05-2.33-3.97 3.86 3.97 3.86 4.05-2.33c.78-.45 1.24-1.2 1.24-2.03s-.46-1.58-1.24-2.03zM16.8 6.54L5.55.05C5.01-.27 4.35-.3 3.8.01L16.8 12l3.66-3.66-3.66-1.8z"/></svg>
        Descargar en Google Play
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const { createClient } = supabase
    const supabaseClient = createClient(
      'https://cvbdrwkwpltjdmvbeagm.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImN2YmRyd2t3cGx0amRtdmJlYWdtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjgyMzA2MjcsImV4cCI6MjA4MzgwNjYyN30.KxIKiyqJDx3F6SHEt9sKd-P4CaKSiOo44PWLzY6zXzo'
    )

    const form = document.getElementById('passwordForm')
    const passwordInput = document.getElementById('password')
    const confirmInput = document.getElementById('confirm')
    const passwordError = document.getElementById('passwordError')
    const confirmError = document.getElementById('confirmError')
    const globalError = document.getElementById('globalError')
    const submitBtn = document.getElementById('submitBtn')
    const formCard = document.getElementById('formCard')
    const successCard = document.getElementById('successCard')

    form.addEventListener('submit', async (e) => {
      e.preventDefault()

      // Reset errors
      passwordError.textContent = ''
      confirmError.textContent = ''
      globalError.style.display = 'none'

      const password = passwordInput.value
      const confirm = confirmInput.value
      let valid = true

      if (password.length < 8) {
        passwordError.textContent = 'La contraseña debe tener al menos 8 caracteres'
        valid = false
      }

      if (password !== confirm) {
        confirmError.textContent = 'Las contraseñas no coinciden'
        valid = false
      }

      if (!valid) return

      submitBtn.disabled = true
      submitBtn.textContent = 'Guardando...'

      const { error } = await supabaseClient.auth.updateUser({ password })

      if (error) {
        globalError.textContent = error.message
        globalError.style.display = 'block'
        submitBtn.disabled = false
        submitBtn.textContent = 'Guardar contraseña'
        return
      }

      formCard.style.display = 'none'
      successCard.style.display = 'block'
    })
  </script>

</body>
</html>
